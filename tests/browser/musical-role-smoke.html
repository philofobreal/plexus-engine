<!doctype html><html lang="en"><meta charset="utf-8"><title>T08 musical role GPU smoke</title>
<style>body{background:#070e1a;color:#e1f6ff;font:15px system-ui;margin:24px}button{padding:12px}#gallery{display:flex;flex-wrap:wrap;gap:12px}figure{margin:0}img{width:180px}pre{white-space:pre-wrap}</style>
<h1>T08 — accent / phrase / section</h1><button id="run" disabled>Run actual note and halo GPU checks</button><p id="status">Loading</p><div id="gallery"></div><pre id="result"></pre>
<script type="module">
import * as THREE from 'three';
import { RhythmNoteField } from '../../src/xr/scene/RhythmNoteField.ts';
import { XrNoteHalos, HALO_CAPACITY } from '../../src/xr/scene/XrNoteHalos.ts';
import { buildRhythmNoteRolePlan, DEFAULT_RHYTHM_GAME_CONFIG as config } from '../../src/gameplay/index.ts';
const result=document.querySelector('#result'),gallery=document.querySelector('#gallery');
function require(v,label){if(!v)throw Error(label);}
document.querySelector('#run').disabled=false;document.querySelector('#status').textContent='Modules ready';
document.querySelector('#run').onclick=()=>{try{
 const renderer=new THREE.WebGLRenderer({antialias:false,preserveDrawingBuffer:true});renderer.setSize(320,320);renderer.setPixelRatio(1);
 const scene=new THREE.Scene();scene.background=new THREE.Color(0x070e1a);
 const camera=new THREE.OrthographicCamera(-.3,.3,.3,-.3,.01,20);camera.position.z=2;camera.updateMatrixWorld();
 const field=new RhythmNoteField(),halos=new XrNoteHalos();scene.add(field.mesh,field.markers,field.arrows,halos.mesh);
 const target=new THREE.WebGLRenderTarget(320,320),capture=()=>{renderer.setRenderTarget(target);renderer.render(scene,camera);const a=new Uint8Array(320*320*4);renderer.readRenderTargetPixels(target,0,0,320,320,a);renderer.setRenderTarget(null);return a;};
 const cases=[];
 for(const design of ['classic','shard'])for(const cutDirection of ['any','up','down-right'])for(const hand of ['left','right'])for(const role of ['accent','phrase','section']){
  const note={id:'test',time:5,lane:1,row:1,hand,intensity:.9,sourceType:1,cutDirection};const active=[{note,status:'pending',judgement:null}];field.setDesign(design);field.update(active,5);
  halos.setPlan(null);const before=capture();halos.setPlan(buildRhythmNoteRolePlan([note],[{noteId:note.id,role}]));halos.update(active,5);const after=capture();let changed=0,centralChanged=0;
  const radius=config.noteSizeMeters*.59*320/.6;
  for(let i=0;i<after.length;i+=4){const d=Math.abs(after[i]-before[i])+Math.abs(after[i+1]-before[i+1])+Math.abs(after[i+2]-before[i+2]);if(d>6){changed++;const x=(i/4)%320-159.5,y=Math.floor(i/4/320)-159.5;if(x*x+y*y<radius*radius)centralChanged++;}}
  require(changed>50,'visible '+design+'/'+cutDirection+'/'+hand+'/'+role);require(centralChanged===0,'hand/cut centre unchanged');
  cases.push({design,cutDirection,hand,role,changed,centralChanged,calls:renderer.info.render.calls});
  if(cutDirection==='up'&&hand==='left'){renderer.render(scene,camera);const figure=document.createElement('figure'),caption=document.createElement('figcaption'),img=document.createElement('img');caption.textContent=design+' / '+role;img.src=renderer.domElement.toDataURL('image/png');figure.append(caption,img);gallery.append(figure);}
 }
 const writes=halos.writes;halos.update([{note:{id:'test',time:5,lane:1,row:1,hand:'right',intensity:.9,sourceType:1},status:'pending',judgement:null}],5.01);require(halos.writes===writes,'time-only update does not upload');
 const pending=capture();halos.onNoteResolved({id:'test',time:5,lane:1,row:1,hand:'right',intensity:.9,sourceType:1},'perfect',5,false);halos.update([],5.2);capture();require(renderer.info.render.calls<=4,'one extra instanced draw');
 halos.update([],5.46);require(halos.mesh.count===0,'burst expires by song time');halos.setPlan(null);capture();
 const output={pass:true,cases,capacity:HALO_CAPACITY,haloTrianglesPerInstance:halos.mesh.geometry.getAttribute('position').count/3,extraDraws:1,noTextures:renderer.info.memory.textures===1,handAndCutCentreUnchanged:true,uniformOnlyTime:true,physicalQuest:'unmeasured',gpuExecutionTime:'unmeasured'};
 field.dispose();halos.dispose();target.dispose();renderer.dispose();result.textContent=JSON.stringify(output,null,2);document.querySelector('#status').textContent='PASS';
}catch(error){result.textContent=JSON.stringify({pass:false,error:String(error),stack:error.stack},null,2);document.querySelector('#status').textContent='FAIL';console.error(error);}};
</script>
