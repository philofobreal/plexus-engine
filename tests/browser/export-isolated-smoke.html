<!doctype html>
<meta charset="utf-8"><title>T19b isolated export</title>
<style>body{font:16px system-ui;background:#101923;color:#dff3ff;margin:24px;max-width:1000px}button{padding:12px}pre{white-space:pre-wrap}video{width:320px}</style>
<h1>T19b isolated export</h1>
<p>Real private Wormhole renderer, snapshot, PostFX, coordinator, encoding worker and OPFS. Synthetic stereo track; live State/p5/AudioEngine must stay untouched.</p>
<button id="run">Run full / prefix / cancel</button>
<button id="codec">Inspect Opus metadata</button><pre id="codec-result"></pre>
<pre id="result">Ready</pre><div id="videos"></div>
<script type="module">
import { WebMExporter } from '../../src/export/WebMExporter.ts';
import { captureExportSnapshot } from '../../src/export/ExportSnapshot.ts';
import { WormholeExportRuntime } from '../../src/visuals/WormholeExportRuntime.ts';
import { cloneDefaultVisualTuning } from '../../src/config/visualTuning.ts';
import { createEmptyTrackAnalysis } from '../../src/analyzer/normalizeAnalysisResult.ts';
import { State } from '../../src/state/store.ts';

const pcm = new AudioBuffer({ numberOfChannels: 2, sampleRate: 48000, length: 96000 });
for (let c = 0; c < 2; c++) { const data = pcm.getChannelData(c); for (let i = 0; i < data.length; i++) data[i] = .1 * Math.sin(2 * Math.PI * (220 + c * 110) * i / 48000); }
const track = createEmptyTrackAnalysis(); track.duration = 2; track.bpm = 120;
const raw = cloneDefaultVisualTuning(); Object.assign(raw, { wormholeGrainDensity: .02, wormholeNebulaAmount: 0, wormholeGalaxy: 0, wormholeStarfield: .1 });
const frame = { e: .3, eRatio: 1, densityProj: .2, melodyProj: .1, fxProj: .1, state: 'DRIVE', subEnergy: .2, bassEnergy: .2, subFlux: .1, bassFlux: .1, perceptualSpectrum: Array(24).fill(.2) };
const input = { audioContentId: 'f'.repeat(64), analysis: { frames: Array.from({length:94},()=>({...frame})), events: [], trackAnalysis: track,
    sampleRate: 48000, hopSize: 1024, bpm: 120, duration: 2, performancePlan: {version:1,source:'edited',points:[]} },
    seed: { version:1,rawTuning:raw,macros:{intensity:.5,motion:.5,depth:.5,detail:.5},boosts:{},policy:{gains:'meta',semanticResolver:false,semanticChoreography:false} },
    presets:{},musicDisplay:{mode:'spectrum',size:.3,opacity:.7},skybox:false,morphScale:1 };
const config = {resolution:'720p',aspectRatio:'16:9',fps:60,runtime:'isolated-wormhole'};
const live = new Proxy({}, { get(_t,key) { throw new Error(`Live renderer/audio access: ${String(key)}`); }, deleteProperty() { throw new Error('Live renderer mutation'); } });
const output = document.querySelector('#result'), urls = [];
const ensure = (v,message) => { if (!v) throw new Error(message); };
const liveSignature = () => JSON.stringify({t:State.currentTime,d:State.duration,e:State.exportTime,x:State.isExporting,v:State.visualTuning,target:State.targetTuning});
async function verify(blob, seconds) {
    const audio = new AudioContext();
    try {
        const decoded = await audio.decodeAudioData(await blob.arrayBuffer());
        ensure(decoded.numberOfChannels===2,'Missing stereo audio');
        ensure(Math.abs(decoded.duration-seconds)<=1/60+.002,`Audio duration mismatch: ${decoded.duration} vs ${seconds}`);
        const video=document.createElement('video');video.controls=true;video.muted=true;
        const url=URL.createObjectURL(blob);urls.push(url);video.src=url;document.querySelector('#videos').append(video);
        await new Promise((resolve,reject)=>{video.onloadeddata=resolve;video.onerror=()=>reject(new Error('Undecodable video'));});
        ensure(video.videoWidth===1280&&video.videoHeight===720,'Wrong output size');
        // Frame zero deliberately has playbackFade=0. Inspect a later decoded frame.
        await new Promise((resolve,reject)=>{video.onseeked=resolve;video.onerror=()=>reject(new Error('Video seek failed'));video.currentTime=Math.min(.5,seconds/2);});
        const canvas=document.createElement('canvas');canvas.width=1280;canvas.height=720;
        const ctx=canvas.getContext('2d');ctx.drawImage(video,0,0);
        ensure(ctx.getImageData(0,0,1280,720).data.some((v,i)=>i%4!==3&&v>4),'Blank Wormhole frame');
        return {audioSeconds:decoded.duration,video:[video.videoWidth,video.videoHeight],nonblank:true};
    }finally{await audio.close();}
}
document.querySelector('#run').onclick=async()=>{
    const button=document.querySelector('#run');button.disabled=true;const results=[];
    try{
        for(const mode of ['full','prefix','cancel']){
            output.textContent=`Running ${mode}…`;let frames=0,profile,disposed=0;
            const before=liveSignature();
            const exporter=new WebMExporter(live,{},live,null,{prepareRuntime:async(c,signal)=>{
                const lease=await captureExportSnapshot(input,pcm,c,signal);
                try{const runtime=new WormholeExportRuntime(lease.snapshot,lease.audio),dispose=runtime.dispose.bind(runtime);
                    runtime.dispose=()=>{disposed++;try{dispose();}finally{lease.dispose();}};return runtime;
                }catch(e){lease.dispose();throw e;}
            },onProfile:p=>{profile=p;}});
            try{
                const blob=await exporter.startExport(config,p=>{if(p<1){frames++;if(mode==='prefix'&&frames===12)exporter.stopAndSave();if(mode==='cancel'&&frames===8)exporter.cancelExport();}});
                ensure(mode!=='cancel','Cancel returned video');
                const decoded=await verify(blob,frames/60);results.push({mode,pass:true,frames,bytes:blob.size,...decoded,profile});
            }catch(e){if(mode!=='cancel'||!String(e).includes('cancelled'))throw e;results.push({mode,pass:true,frames,noResult:true,profile});}
            ensure(disposed===1,'Runtime lease not released exactly once');ensure(before===liveSignature(),'Live state changed');
        }
        output.textContent=JSON.stringify({pass:true,results},null,2);
    }catch(e){output.textContent=JSON.stringify({pass:false,error:String(e),results},null,2);}
    finally{button.disabled=false;}
};
addEventListener('pagehide',()=>urls.forEach(url=>URL.revokeObjectURL(url)));
document.querySelector('#codec').onclick=async()=>{
    const chunks=[];let metadata;
    const encoder=new AudioEncoder({output(chunk,meta){
        if(meta?.decoderConfig){const description=meta.decoderConfig.description;
            const bytes=description?new Uint8Array(description.buffer??description,description.byteOffset??0,description.byteLength):null;
            metadata={...meta.decoderConfig,description:bytes?[...bytes]:null};}
        chunks.push({timestamp:chunk.timestamp,duration:chunk.duration,bytes:chunk.byteLength});
    },error:e=>{document.querySelector('#codec-result').textContent=String(e);}});
    encoder.configure({codec:'opus',sampleRate:48000,numberOfChannels:2});
    const planar=new Float32Array(pcm.length*2);planar.set(pcm.getChannelData(0));planar.set(pcm.getChannelData(1),pcm.length);
    const data=new AudioData({format:'f32-planar',sampleRate:48000,numberOfFrames:pcm.length,numberOfChannels:2,timestamp:0,data:planar});
    encoder.encode(data);data.close();await encoder.flush();encoder.close();
    document.querySelector('#codec-result').textContent=JSON.stringify({metadata,count:chunks.length,first:chunks.slice(0,2),last:chunks.slice(-2)},null,2);
};
</script>
