<!doctype html>
<meta charset="utf-8"><title>T19c3 isolated export acceptance</title>
<style>body{font:16px system-ui;background:#101923;color:#dff3ff;margin:24px;max-width:1000px}button{padding:12px}pre{white-space:pre-wrap;max-height:24rem;overflow:auto}video{width:320px}#videos{position:fixed;right:12px;bottom:12px;z-index:1}#videos video{display:none}#videos video:last-child{display:block}</style>
<h1>T19c3 isolated export acceptance</h1>
<p>Real private Wormhole renderer, snapshot, PostFX, coordinator, encoding worker and OPFS. Synthetic stereo track; live State/p5/AudioEngine must stay untouched.</p>
<button id="run">Run full / prefix / cancel</button>
<label>Output <select id="resolution"><option>720p</option><option>1080p</option><option>4K</option></select></label>
<label>Track length <select id="duration"><option value="2">2 seconds</option><option value="300">5 minutes</option></select></label>
<button id="dialog">Open real MVP export dialog</button>
<button id="codec">Inspect Opus metadata</button><pre id="codec-result"></pre>
<p id="summary">Ready: full, Stop-prefix, Cancel, retry and retained File checks.</p><pre id="result">Ready</pre><div id="videos"></div>
<script type="module">
import { WebMExporter } from '../../src/export/WebMExporter.ts';
import { captureExportSnapshot } from '../../src/export/ExportSnapshot.ts';
import { WormholeExportRuntime } from '../../src/visuals/WormholeExportRuntime.ts';
import { cloneDefaultVisualTuning } from '../../src/config/visualTuning.ts';
import { createEmptyTrackAnalysis } from '../../src/analyzer/normalizeAnalysisResult.ts';
import { inspectExportWebM } from '../helpers/inspect-export-webm.mjs';
import '../../src/ui/mvp/mvp.css';
import { ExportDialog } from '../../src/ui/mvp/ExportDialog.ts';
import { getExportCacheSummary, clearFinishedExportCache } from '../../src/export/ExportStorageLease.ts';
import { State } from '../../src/state/store.ts';

let pcm = new AudioBuffer({ numberOfChannels: 2, sampleRate: 48000, length: 96000 });
for (let c = 0; c < 2; c++) { const data = pcm.getChannelData(c); for (let i = 0; i < data.length; i++) data[i] = .1 * Math.sin(2 * Math.PI * (220 + c * 110) * i / 48000); }
const track = createEmptyTrackAnalysis(); track.duration = 2; track.bpm = 120;
const raw = cloneDefaultVisualTuning(); Object.assign(raw, { wormholeGrainDensity: .02, wormholeNebulaAmount: 0, wormholeGalaxy: 0, wormholeStarfield: .1 });
const frame = { e: .3, eRatio: 1, densityProj: .2, melodyProj: .1, fxProj: .1, state: 'DRIVE', subEnergy: .2, bassEnergy: .2, subFlux: .1, bassFlux: .1, perceptualSpectrum: Array(24).fill(.2) };
const input = { audioContentId: 'f'.repeat(64), analysis: { frames: Array.from({length:94},()=>({...frame})), events: [], trackAnalysis: track,
    sampleRate: 48000, hopSize: 1024, bpm: 120, duration: 2, performancePlan: {version:1,source:'edited',points:[]} },
    seed: { version:1,rawTuning:raw,macros:{intensity:.5,motion:.5,depth:.5,detail:.5},boosts:{},policy:{gains:'meta',semanticResolver:false,semanticChoreography:false} },
    presets:{},musicDisplay:{mode:'spectrum',size:.3,opacity:.7},skybox:false,morphScale:1 };
const config = {resolution:'720p',aspectRatio:'16:9',fps:60,runtime:'isolated-wormhole',preflight:true};
const live = new Proxy({}, { get(_t,key) { throw new Error(`Live renderer/audio access: ${String(key)}`); }, deleteProperty() { throw new Error('Live renderer mutation'); } });
const output = document.querySelector('#result'), urls = [];
const dialog = new ExportDialog({onStart:()=>dialog.setStatus('This acceptance fixture runs through its Run button.'),onStop(){},onCancel(){},getCacheSummary:getExportCacheSummary,onClearCache:clearFinishedExportCache},true);
document.body.append(dialog.root);document.querySelector('#dialog').onclick=()=>dialog.open();
const ensure = (v,message) => { if (!v) throw new Error(message); };
const liveSignature = () => JSON.stringify({t:State.currentTime,d:State.duration,e:State.exportTime,x:State.isExporting,v:State.visualTuning,target:State.targetTuning});
async function verify(blob, seconds) {
    ensure(blob.size <= 64*1024*1024, 'Acceptance reader 64 MiB bound exceeded; not a production export limit');
    const bytes = new Uint8Array(await blob.arrayBuffer());
    const packets = inspectExportWebM(bytes,{frames:Math.round(seconds*60),fps:60});
    const audio = new AudioContext();
    try {
        const decoded = await audio.decodeAudioData(bytes.buffer);
        ensure(decoded.numberOfChannels===2,'Missing stereo audio');
        ensure(Math.abs(decoded.duration-seconds)<=1/60+.002,`Audio duration mismatch: ${decoded.duration} vs ${seconds}`);
        const video=document.createElement('video');video.controls=true;video.muted=true;
        const url=URL.createObjectURL(blob);urls.push(url);video.src=url;document.querySelector('#videos').append(video);
        await new Promise((resolve,reject)=>{video.onloadeddata=resolve;video.onerror=()=>reject(new Error('Undecodable video'));});
        const height=config.resolution==='4K'?2160:config.resolution==='1080p'?1080:720,width=Math.round(height*16/9);
        ensure(video.videoWidth===width&&video.videoHeight===height,'Wrong output size');
        const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;
        const ctx=canvas.getContext('2d'), seeks=[...new Set([Math.min(.5,seconds/2),seconds/2,Math.max(seconds/2,seconds-.1)])];
        for(const time of seeks){
            await new Promise((resolve,reject)=>{
                const timer=setTimeout(()=>reject(new Error('Decoded frame presentation timed out')),15000);
                video.onerror=()=>{clearTimeout(timer);reject(new Error('Video seek failed'));};
                video.requestVideoFrameCallback(()=>{clearTimeout(timer);resolve();});video.currentTime=time;
            });
            ctx.drawImage(video,0,0);ensure(ctx.getImageData(0,0,width,height).data.some((v,i)=>i%4!==3&&v>4),`Blank Wormhole frame at ${time}`);
        }
        return {audioSeconds:decoded.duration,video:[video.videoWidth,video.videoHeight],nonblank:true,seeks,packets};
    }finally{await audio.close();}
}
document.querySelector('#run').onclick=async()=>{
    const button=document.querySelector('#run');button.disabled=true;dialog.setActive(true);const results=[];
    const resolution=document.querySelector('#resolution');resolution.disabled=true;config.resolution=resolution.value;
    const duration=document.querySelector('#duration');duration.disabled=true;const seconds=Number(duration.value);
    pcm=new AudioBuffer({numberOfChannels:2,sampleRate:48000,length:48000*seconds});
    for(let c=0;c<2;c++){const data=pcm.getChannelData(c);for(let i=0;i<data.length;i++)data[i]=.1*Math.sin(2*Math.PI*(220+c*110)*i/48000);}
    track.duration=seconds;input.analysis.duration=seconds;input.analysis.frames=Array.from({length:Math.ceil(seconds*48000/1024)},()=>({...frame}));
    const retained=[];
    try{
        for(const mode of ['full','prefix','cancel','retry']){
            output.textContent=`Running ${mode}…`;let frames=0,profile,disposed=0;const started=performance.now();
            const before=liveSignature();
            const exporter=new WebMExporter(live,{},live,null,{prepareRuntime:async(c,signal)=>{
                const lease=await captureExportSnapshot(input,pcm,c,signal);
                try{const runtime=new WormholeExportRuntime(lease.snapshot,lease.audio),dispose=runtime.dispose.bind(runtime);
                    runtime.dispose=()=>{disposed++;try{dispose();}finally{lease.dispose();}};return runtime;
                }catch(e){lease.dispose();throw e;}
            },onProfile:p=>{profile=p;}});
            try{
                const blob=await exporter.startExport(config,p=>{if(p<1){frames++;if(frames%300===0)output.textContent=`Running ${mode}: ${frames}/${seconds*60} frames (${config.resolution})`; if((mode==='prefix'||mode==='retry')&&frames===12)exporter.stopAndSave();if(mode==='cancel'&&frames===8)exporter.cancelExport();}});
                ensure(mode!=='cancel','Cancel returned video');
                const exportWallMs=performance.now()-started;const decoded=await verify(blob,frames/60);
                retained.push({blob,head:[...new Uint8Array(await blob.slice(0,32).arrayBuffer())]});
                results.push({mode,pass:true,frames,sourceSeconds:seconds,exportWallMs,bytes:blob.size,...decoded,profile});
            }catch(e){if(mode!=='cancel'||!String(e).includes('cancelled'))throw e;results.push({mode,pass:true,frames,noResult:true,profile});}
            ensure(disposed===1,'Runtime lease not released exactly once');ensure(before===liveSignature(),'Live state changed');
        }
        for(const item of retained)ensure(JSON.stringify([...new Uint8Array(await item.blob.slice(0,32).arrayBuffer())])===JSON.stringify(item.head),'A later job invalidated a retained File');
        document.querySelector('#summary').textContent=`PASS: ${config.resolution} / ${seconds}s full track; Stop-prefix, Cancel, retry and retained File reads. Packet clocks within 1ms.`;
        output.textContent=JSON.stringify({pass:true,retainedFilesReadable:true,fixture:{sourceSeconds:seconds,resolution:config.resolution,fps:60,density:.02,readerLimitBytes:64*1024*1024,peakMemory:'unmeasured'},results},null,2);
    }catch(e){document.querySelector('#summary').textContent=`FAIL: ${String(e)}`;output.textContent=JSON.stringify({pass:false,error:String(e),results},null,2);}
    finally{dialog.setActive(false);button.disabled=false;resolution.disabled=false;duration.disabled=false;}
};
addEventListener('pagehide',()=>urls.forEach(url=>URL.revokeObjectURL(url)));
document.querySelector('#codec').onclick=async()=>{
    const chunks=[];let metadata;
    const encoder=new AudioEncoder({output(chunk,meta){
        if(meta?.decoderConfig){const description=meta.decoderConfig.description;
            const bytes=description?new Uint8Array(description.buffer??description,description.byteOffset??0,description.byteLength):null;
            metadata={...meta.decoderConfig,description:bytes?[...bytes]:null};}
        chunks.push({timestamp:chunk.timestamp,duration:chunk.duration,bytes:chunk.byteLength});
    },error:e=>{document.querySelector('#codec-result').textContent=String(e);}});
    encoder.configure({codec:'opus',sampleRate:48000,numberOfChannels:2});
    const planar=new Float32Array(pcm.length*2);planar.set(pcm.getChannelData(0));planar.set(pcm.getChannelData(1),pcm.length);
    const data=new AudioData({format:'f32-planar',sampleRate:48000,numberOfFrames:pcm.length,numberOfChannels:2,timestamp:0,data:planar});
    encoder.encode(data);data.close();await encoder.flush();encoder.close();
    document.querySelector('#codec-result').textContent=JSON.stringify({metadata,count:chunks.length,first:chunks.slice(0,2),last:chunks.slice(-2)},null,2);
};
</script>
