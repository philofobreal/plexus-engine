<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Wormhole coherent twist smoke</title>
<style>
body { background: #070916; color: #eef7ff; font: 16px system-ui; margin: 20px; }
main { display: flex; gap: 16px; } figure { margin: 0; } canvas { width: 520px; height: 360px; }
button { padding: 8px 16px; margin-bottom: 16px; } figcaption { padding: 8px; }
</style>
<h2>Coherent spiral: same preset and song time, opposite directions</h2>
<p>Isolated real renderer smoke. Path bend and lens are unchanged; no audio clock or camera roll.</p>
<button id="four">At 4 s</button><button id="six">At 6 s</button>
<button id="finite">Finite deadline</button><pre id="finite-result"></pre>
<button id="arrival">Arrive at cue</button><pre id="arrival-result"></pre>
<button id="semantic">Continuous semantic timing</button><pre id="semantic-result"></pre>
<p>Shared dashboard/MVP timeline: automatic ramp2–4s, cue unchanged at4s.</p>
<canvas id="arrival-timeline" style="width:1070px;height:120px"></canvas>
<main><figure id="left"><figcaption>Left: loading</figcaption></figure><figure id="right"><figcaption>Right: loading</figcaption></figure></main>
<script type="module">
import { WormholeCanvasSource } from '../../src/visuals/WormholeCanvasSource.ts';
import { createEmptyTrackAnalysis } from '../../src/analyzer/normalizeAnalysisResult.ts';
import { TimelineCanvas } from '../../src/ui/TimelineCanvas.ts';
const timelinePoints=[0,4].map((time,i)=>({id:'timeline-'+i,time,sectionId:'s',preset:i?'vos-wh-overdrive.json':'vos-wh-drift.json',confidence:1,intensity:1,
 reason:'verse',morphDurationSec:2,morphCurve:'easeInOut',cuePlacement:{role:'structure',start:0,end:12}}));
new TimelineCanvas(document.querySelector('#arrival-timeline')).render({isExporting:false,isPlaying:false,currentTime:3,duration:12,zoom:1,pan:0,bpm:120,
 sampleRate:44100,hopSize:1024,frames:[],sections:[],bars:[],cues:[],significantMoments:[],buildupConfidence:[],spectralPivot:[],
 tensionTrends:{globalSlope:0,peakTime:0,peakValue:0,segments:[]},performancePlan:{version:1,source:'auto',points:timelinePoints},
 timelineLayers:{waveform:false,rms:false,buildup:false,cues:false,automation:true},audioSensitivity:1,dropAnticipation:0,gridOffset:0});
const sources = [];
for (const [label, direction] of [['left', -1], ['right', 1]]) {
 const source = new WormholeCanvasSource({ width: 520, height: 360 });
 const point = { id: 'p', time: 0, sectionId: 's', preset: 'vos-wh-overdrive.json', confidence: 1, intensity: 1,
  reason: 'build', morphDurationSec: 2, morphCurve: 'easeInOut', spiralDirection: direction };
 source.setPresentation({ macros: { intensity: .5, motion: .5, depth: .5, detail: 1 },
  grainMaterial: { wormholeNebulaAmount: .8, wormholeSpiral: 1, wormholeSpiralArms: .5, wormholeGrainDensity: .25 } });
 await source.prepare({ frames: [], events: [], sampleRate: 44100, hopSize: 1024, bpm: 128, duration: 20,
  trackAnalysis: createEmptyTrackAnalysis(), performancePlan: { version: 1, source: 'edited', points: [point] } });
 document.querySelector(`#${label}`).append(source.canvas); sources.push({ label, source });
 // Warm the existing playback fade with explicit song times, never a wall clock.
 for (let time = 0; time <= 4; time += .25) source.render(time, true, true);
}
function draw(time) {
 for (const { label, source } of sources) {
  source.render(time, false);
  document.querySelector(`#${label} figcaption`).textContent = `${label}: ${source.spatialFrame.spiralTurns.toFixed(3)} turns, ${time} song seconds`;
 }
}
document.querySelector('#four').onclick = () => draw(4);
document.querySelector('#six').onclick = () => draw(6);
document.querySelector('#finite').onclick = async () => {
 try {
  let maxResidual=0,colouredPixels=0;
  for(const {label,source} of sources){
   const points=[0,4].map((time,i)=>({id:'finite-'+i,time,sectionId:'finite',preset:i?'vos-wh-overdrive.json':'vos-wh-drift.json',
    confidence:1,intensity:1,reason:'verse',locked:true,morphDurationSec:.1,morphCurve:'linear',spiralDirection:label==='left'?-1:1,
    cuePlacement:{role:i?'structure':'scene-entry',start:0,end:20}}));
   await source.prepare({frames:[],events:[],sampleRate:44100,hopSize:1024,bpm:128,duration:20,
    trackAnalysis:createEmptyTrackAnalysis(),performancePlan:{version:1,source:'auto',points}});
   for(let t=0;t<=4;t+=.25)source.render(t,true,true);
   source.render(4.05,false,true);source.render(4.1,false,true);
   const residual=Math.abs(source.context.state.visualTuning.wormholeSpeed-source.context.boosted.wormholeSpeed);maxResidual=Math.max(maxResidual,residual);
   const pixels=source.canvas.getContext('2d').getImageData(0,0,520,360).data;
   for(let i=0;i<pixels.length;i+=4)if(Math.max(pixels[i],pixels[i+1],pixels[i+2])>35&&Math.max(pixels[i],pixels[i+1],pixels[i+2])-Math.min(pixels[i],pixels[i+1],pixels[i+2])>10)colouredPixels++;
   document.querySelector(`#${label} figcaption`).textContent=`${label}: finite deadline4.1s, residual ${residual.toExponential(2)}`;
  }
  const ok=maxResidual<1e-9&&colouredPixels>100;
  document.querySelector('#finite-result').textContent=`${ok?'PASS':'FAIL'}: finite preset speed arrival; residual=${maxResidual}; coloured pixels=${colouredPixels}`;
  document.querySelector('#finite-result').dataset.result=ok?'pass':'fail';
 }catch(error){document.querySelector('#finite-result').textContent='ERROR: '+error.message;}
};
document.querySelector('#arrival').onclick=async()=>{
 try{
  let residual=0,midpointError=0,pixels=0,logical=true;
  for(const {label,source}of sources){
   const points=[0,4].map((time,i)=>({id:'arrival-'+i,time,sectionId:'s',preset:i?'vos-wh-overdrive.json':'vos-wh-drift.json',confidence:1,intensity:1,
    reason:'verse',morphDurationSec:.1,morphCurve:'linear',spiralDirection:label==='left'?-1:1,cuePlacement:{role:'structure',start:0,end:20}}));
   await source.prepare({frames:[],events:[],sampleRate:44100,hopSize:1024,bpm:128,duration:20,trackAnalysis:createEmptyTrackAnalysis(),performancePlan:{version:1,source:'auto',points}});
   for(let t=0;t<3.9;t+=.25)source.render(t,true,true);
   source.render(3.9,false,true);const start=source.context.state.visualTuning.wormholeSpeed;
   source.render(3.95,false,true);const mid=source.context.state.visualTuning.wormholeSpeed;
   logical&&=source.context.state.activeVisualTransitionId?.includes('automation:arrival-0');
   source.render(4,false,true);const end=source.context.state.visualTuning.wormholeSpeed;
   residual=Math.max(residual,Math.abs(end-source.context.boosted.wormholeSpeed));midpointError=Math.max(midpointError,Math.abs(mid-(start+end)/2));
   const data=source.canvas.getContext('2d').getImageData(0,0,520,360).data;for(let i=0;i<data.length;i+=4)if(Math.max(data[i],data[i+1],data[i+2])>35&&Math.max(data[i],data[i+1],data[i+2])-Math.min(data[i],data[i+1],data[i+2])>10)pixels++;
   document.querySelector(`#${label} figcaption`).textContent=`${label}: pre-roll3.9s → cue4.0s; residual ${residual.toExponential(2)}`;
  }
  const ok=residual<1e-9&&midpointError<1e-9&&logical&&pixels>100;
  document.querySelector('#arrival-result').textContent=`${ok?'PASS':'FAIL'}: cue arrival; endpoint=${residual}; midpoint=${midpointError}; logical=${logical}; coloured pixels=${pixels}`;
  document.querySelector('#arrival-result').dataset.result=ok?'pass':'fail';
 }catch(e){document.querySelector('#arrival-result').textContent='ERROR: '+e.message;}
};
document.querySelector('#semantic').onclick=async()=>{
 try{
  let error=0,pauseError=0,pixels=0,logical=true;
  for(const {label,source}of sources){
   await source.prepare({frames:[],events:[],sampleRate:44100,hopSize:1024,bpm:128,duration:20,
    trackAnalysis:createEmptyTrackAnalysis(),performancePlan:null});
   // Explicit isolated test publication: no producer, audio clock or persistent setting is changed.
   const context=source.context;context.policy.gains='raw';
   context.semanticBase.wormholeSpeed=.4;context.semanticBase.transitionSpeed=0;
   Object.assign(context.state.targetTuning,context.semanticBase);
   const f=(time,progress)=>({time,motifId:'a',phrasePosition:0,actions:{accelerate:progress},activeOperators:[],
    motifIntensity:0,motifDensity:0,motifMotion:0,novelty:0,
    transition:{behavior:'morph',progress,preserve:[],fromMotif:'void-minimal',toMotif:'tunnel-drive'}});
   context.choreography={version:1,frames:[f(2,0),f(3,.5),f(3.999999,1)],score:{version:1,motifs:[],
    transitions:[{fromMotifId:'a',toMotifId:'b',startTime:2,duration:2,behavior:'morph',curve:'linear',preserve:[]}]}};
   source.render(2.25,true,true);const first=context.state.activeVisualTransitionId;
   source.render(2.5,true,true);const actual=context.state.visualTuning.wormholeSpeed;
   error=Math.max(error,Math.abs(actual-1.15));logical&&=first===context.state.activeVisualTransitionId;
   for(let i=0;i<20;i++)source.render(2.5,false,true);
   pauseError=Math.max(pauseError,Math.abs(actual-context.state.visualTuning.wormholeSpeed));
   const data=source.canvas.getContext('2d').getImageData(0,0,520,360).data;
   for(let i=0;i<data.length;i+=4)if(Math.max(data[i],data[i+1],data[i+2])>35&&Math.max(data[i],data[i+1],data[i+2])-Math.min(data[i],data[i+1],data[i+2])>10)pixels++;
   document.querySelector(`#${label} figcaption`).textContent=`${label}: semantic speed ${actual.toFixed(3)} at 2.5s; stable logical token`;
  }
  const ok=error<1e-9&&pauseError<1e-9&&logical&&pixels>100;
  document.querySelector('#semantic-result').textContent=`${ok?'PASS':'FAIL'}: continuous semantic timing; sample error=${error}; pause drift=${pauseError}; logical=${logical}; coloured pixels=${pixels}`;
  document.querySelector('#semantic-result').dataset.result=ok?'pass':'fail';
 }catch(e){document.querySelector('#semantic-result').textContent='ERROR: '+e.message;}
};
window.addEventListener('pagehide', () => sources.forEach(({ source }) => source.dispose()), { once: true });
draw(4);
</script>
</html>
