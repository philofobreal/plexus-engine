<!doctype html><html lang="en"><meta charset="utf-8"><title>T16 music display — real raster / worker / GPU</title>
<style>body{margin:24px;background:#080e1a;color:#eef8ff;font:16px system-ui}button{padding:12px}#gallery{display:grid;grid-template-columns:1fr 1fr;gap:20px}canvas{width:100%;height:auto}figure{margin:0}pre{white-space:pre-wrap}</style>
<h1>Music display — Canvas, exact worker, MVP Offscreen and native GPU</h1><button id="run" disabled>Run checks</button><p id="status">Loading modules…</p><div id="gallery"></div><pre id="result"></pre>
<script type="module">
import * as THREE from 'three';
import {WormholeCanvasSource} from '../../src/visuals/WormholeCanvasSource.ts';
import {WormholeExactWorkerSource} from '../../src/visuals/WormholeExactWorkerSource.ts';
import {WormholeHostWorkerSource} from '../../src/visuals/WormholeHostWorkerSource.ts';
import {WormholeFrameContext} from '../../src/visuals/WormholeFrameContext.ts';
import {cloneDefaultVisualTuning} from '../../src/config/visualTuning.ts';
import {defaultAdvancedBoosts} from '../../src/config/metaTuningBoost.ts';
import {createEmptyTrackAnalysis} from '../../src/analyzer/normalizeAnalysisResult.ts';
import {XrMusicDisplay} from '../../src/xr/scene/XrMusicDisplay.ts';
import {sampleMusicSpectrum} from '../../src/presentation/MusicSpectrum.ts';
const seed={version:1,rawTuning:{...cloneDefaultVisualTuning(),wormholeGrainDensity:0,wormholeNebulaAmount:0,wormholeStarfield:0,wormholeGalaxy:0,wormholeSky:0,wormholeWall:0},
 macros:{intensity:.5,motion:.5,depth:.5,detail:.5},boosts:defaultAdvancedBoosts(),policy:{gains:'meta',semanticResolver:false,semanticChoreography:false}};
const frames=Array.from({length:16},(_,n)=>({e:.3,eRatio:1,densityProj:.2,melodyProj:.1,fxProj:0,state:'DRIVE',perceptualSpectrum:Array.from({length:24},(_,i)=>.15+.7*((i+n)%24)/24)}));
const analysis={frames,events:[],sampleRate:4,hopSize:1,bpm:120,duration:4,trackAnalysis:createEmptyTrackAnalysis(),performancePlan:{version:1,source:'edited',points:[]}};
analysis.trackAnalysis.features=frames.map(()=>({melody:0,vocal:0,fx:0,density:.2,brightness:.4,tension:0}));
const settings={mode:'spectrum',size:.85,opacity:.8},time=.375;
const status=document.querySelector('#status'),result=document.querySelector('#result'),gallery=document.querySelector('#gallery');
const require=(v,label)=>{if(!v)throw Error(label)};
function show(image,label){const f=document.createElement('figure'),caption=document.createElement('figcaption'),c=document.createElement('canvas');c.width=640;c.height=360;c.getContext('2d').drawImage(image,0,0,640,360);caption.textContent=label;f.append(caption,c);gallery.append(f);return c}
const pixels=c=>c.getContext('2d').getImageData(0,0,c.width,c.height).data;
const difference=(a,b)=>{let total=0;for(let i=0;i<a.length;i++)total+=Math.abs(a[i]-b[i]);return total/a.length/255};
const waitFor=async predicate=>{const until=performance.now()+15000;while(!predicate()){if(performance.now()>until)throw Error('MVP worker deadline');await new Promise(r=>setTimeout(r,20))}};
document.querySelector('#run').onclick=async()=>{const resources=[];try{
 gallery.replaceChildren();status.textContent='Running real render checks…';const rows=[];
 const options={width:640,height:360,contextSeed:seed};
 const local=new WormholeCanvasSource(options);resources.push(local);await local.prepare(analysis);local.setPresentation({musicDisplay:settings});local.renderExact(time);
 const main=show(local.canvas,'XR / shared raster at 0.375 s'),first=pixels(main).slice();local.renderExact(1.125);local.renderExact(time);
 const repeat=show(local.canvas,'Exact seek back to 0.375 s');require(difference(first,pixels(repeat))===0,'exact seek/repeat pixels');
 const exact=new WormholeExactWorkerSource({contextId:'t16-music-display',...options});resources.push(exact);await exact.prepare(analysis);exact.setPresentation({musicDisplay:settings});
 const lease=await exact.requestFrame(3,8);let focus;try{const worker=show(lease.bitmap,'Exact Offscreen worker at 0.375 s');const mae=difference(first,pixels(worker));require(mae<=.001,'local / exact worker parity');rows.push({exactWorkerMae:mae,songTime:lease.identity.songTime});focus={...lease.focalPoint}}finally{lease.release()}
 const context=new WormholeFrameContext(seed);resources.push(context);context.prepare(analysis);context.step(time,false,0,null,true,true);
 const host=new WormholeHostWorkerSource(()=>{});resources.push(host);const hostCanvas=document.createElement('canvas');hostCanvas.width=640;hostCanvas.height=360;
 const target={width:640,height:360,rasterPixelRatio:1,compactMaterialPreview:true,frameCount:0,presentRaster:image=>hostCanvas.getContext('2d').drawImage(image,0,0),background(){}};
 host.draw(context.state,target,0,false,false,settings);await waitFor(()=>{host.draw(context.state,target,0,false,false,settings);return host.framesReceived>0});host.draw(context.state,target,0,false,false,settings);
 show(hostCanvas,'MVP live Offscreen worker — same published spectrum');rows.push({mvpFrames:host.framesReceived,mvpRaster:host.rasterKind});
 const native=new XrMusicDisplay();resources.push(native);native.update(frames,4,1,time,focus,40,1.65,settings);
 const expected=new Float32Array(24);sampleMusicSpectrum(frames,4,1,time,expected);require([...expected].every((v,i)=>v===native.bands[i]),'native / raster data parity');
 const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});resources.push(renderer);renderer.setSize(640,360);renderer.debug.onShaderError=()=>{throw Error('native spectrum shader failure')};
 const scene=new THREE.Scene();scene.background=new THREE.Color(0x080e1a);scene.add(native.mesh);const camera=new THREE.PerspectiveCamera(75,640/360,.05,1000);camera.position.set(0,1.65,0);camera.lookAt(0,1.65,-40);
 renderer.render(scene,camera);require(renderer.info.render.calls===1,'one native display draw');show(renderer.domElement,'Native XR — one GPU batch, clear center / lower corridor');rows.push({nativeCalls:renderer.info.render.calls,nativeTriangles:renderer.info.render.triangles,bands:24});
 native.update(frames,4,1,time,focus,40,1.65,{...settings,mode:'off'});renderer.render(scene,camera);require(renderer.info.render.calls===0,'Off adds no native draw');
 status.textContent='PASS — real raster, exact worker, MVP Offscreen and native GPU';result.textContent=JSON.stringify({pass:true,rows,scope:'Synthetic display fixture; no Quest comfort/FPS or musical ground-truth claim'},null,2);
}catch(e){status.textContent='FAIL: '+e.message;result.textContent=e.stack;throw e}finally{for(const r of resources.reverse())r.dispose()}};
document.querySelector('#run').disabled=false;status.textContent='Ready';
</script></html>
