<!doctype html><html lang="en"><meta charset="utf-8"><title>Native XR wall</title>
<style>body{background:#080b18;color:#eef;font:15px system-ui;margin:22px}canvas{width:720px;height:405px}pre{white-space:pre-wrap}.previews{display:flex;flex-wrap:wrap;gap:12px}.previews img{width:240px}figure{margin:0}</style>
<h1>Native membrane / caustics / mosaic / cracks</h1><p>Original preprojection wall paths, real module worker and per-eye GPU strokes. Desktop evidence; Quest pacing and comfort remain manual.</p>
<button id="run">Run wall checks</button><div id="view"></div><div class="previews" id="previews"></div><pre id="result">Ready</pre>
<script type="module">
import * as THREE from 'three';
import{WormholeNativeSource}from'../../src/visuals/WormholeNativeSource.ts';
import{WormholeNativeWorkerSource}from'../../src/visuals/WormholeNativeWorkerSource.ts';
import{XrNativeWormhole}from'../../src/xr/scene/XrNativeWormhole.ts';
import{createEmptyTrackAnalysis}from'../../src/analyzer/normalizeAnalysisResult.ts';
const output=document.querySelector('#result'),button=document.querySelector('#run');let cleanup=()=>{};
button.onclick=async()=>{button.disabled=true;cleanup();output.textContent='Checking native wall…';try{
 const renderer=new THREE.WebGLRenderer({antialias:false,preserveDrawingBuffer:true});renderer.setSize(480,270);renderer.setClearColor(0);document.querySelector('#view').replaceChildren(renderer.domElement);
 const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(70,480/270,.05,1500),native=new XrNativeWormhole({dispose(){}});scene.add(native.root);native.setEyeHeight(0);
 const direct=new WormholeNativeSource(),worker=new WormholeNativeWorkerSource({mainFactory:()=>{throw Error('Unexpected fallback');}});cleanup=()=>{worker.dispose();direct.dispose();native.dispose();renderer.dispose();};
 const frames=Array.from({length:440},()=>({e:.8,eRatio:1.2,densityProj:.6,melodyProj:.4,fxProj:.1,subEnergy:1,bassEnergy:.8,subFlux:.2,bassFlux:.15,state:'DRIVE',perceptualSpectrum:Array(24).fill(.95)}));
 const analysis={frames,events:[{time:2,type:0,intensity:1}],sampleRate:44100,hopSize:1024,bpm:128,duration:10,trackAnalysis:createEmptyTrackAnalysis(),performancePlan:{version:1,source:'edited',points:[{id:'a',time:0,preset:'vos-wh-overdrive.json',confidence:1,intensity:1,reason:'build',morphDurationSec:2,morphCurve:'linear'}]}};
 analysis.trackAnalysis.features=frames.map(()=>({melody:.4,vocal:.1,fx:.1,density:.6,brightness:.5,tension:.3}));const before=JSON.stringify(analysis);
 const presentation={wall:{mode:'on',material:'membrane'},cosmos:{stars:1,galaxies:1,sky:1}};direct.setPresentation(presentation);worker.setPresentation(presentation);await Promise.all([direct.prepare(analysis),worker.prepare(analysis)]);
 let mainCallMs=0;
 async function sample(time){await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('Worker deadline')),5000);worker.onError=m=>{clearTimeout(timer);reject(Error(m));};worker.onFrameReady=()=>{const start=performance.now(),changed=worker.render(time,false);mainCallMs+=performance.now()-start;if(changed&&worker.frame?.songTime===time){clearTimeout(timer);resolve();}};const start=performance.now();worker.render(time,false);mainCallMs=performance.now()-start;});}
 const read=()=>{const d=new Uint8Array(480*270*4),gl=renderer.getContext();gl.readPixels(0,0,480,270,gl.RGBA,gl.UNSIGNED_BYTE,d);return d;};
 const display=f=>{native.setFrame(f);renderer.render(scene,camera);return read();};
 const statsPixels=d=>{let sum=0,x=0,lit=0;for(let i=0;i<d.length;i+=4){const w=d[i]+d[i+1]+d[i+2];sum+=w;x+=(i/4%480)*w;if(w>3)lit++;}return{sum,x:sum?x/sum:null,lit};};
 const diff=(a,b)=>{let pixels=0,max=0;for(let i=0;i<a.length;i+=4){const d=Math.abs(a[i]-b[i])+Math.abs(a[i+1]-b[i+1])+Math.abs(a[i+2]-b[i+2]);if(d>0)pixels++;max=Math.max(max,d);}return{pixels,max};};
 const empty={version:1,generation:1,serial:1,songTime:0,count:0,data:new Float32Array(0)};
 const probe=z=>{const d=new Float32Array(16);d.set([0,4,0,z,4,.15,z,.08,1,1,1,.6,0,0,0,0]);return{...empty,wall:{count:1,data:d}};};
 const eye=(x,z)=>{camera.position.x=x;return statsPixels(display(probe(z))).x;};const near=Math.abs(eye(-.032,-6)-eye(.032,-6)),far=Math.abs(eye(-.032,-24)-eye(.032,-24));camera.position.x=0;
 const priority=[];for(const transparent of[false,true]){const p=probe(-6),baseline=statsPixels(display(p)).sum,cover=new THREE.Mesh(new THREE.PlaneGeometry(2,2),new THREE.MeshBasicMaterial({color:0,transparent,opacity:1,depthWrite:!transparent}));cover.position.set(4,0,-5);cover.renderOrder=transparent?-10:0;scene.add(cover);const covered=statsPixels(display(p)).sum;priority.push({transparent,baseline,covered,pass:baseline>0&&covered<baseline*.05});scene.remove(cover);cover.geometry.dispose();cover.material.dispose();}
 const unsafe=probe(-.1);display(unsafe);const nearCulled=native.wall.mesh.geometry.instanceCount===0;
 const parity=[];let fixture;for(const time of[2.05,3,.4,2.05]){direct.render(time,false,false);await sample(time);const a=direct.frame,b=worker.frame;let maxFloatDiff=0;
  for(const[x,y,n]of[[a.data,b.data,a.count*16],[a.weave.data,b.weave.data,a.weave.count*16],[a.cosmos.data,b.cosmos.data,a.cosmos.count*16],[a.wall.data,b.wall.data,a.wall.count*16]])for(let i=0;i<n;i++)maxFloatDiff=Math.max(maxFloatDiff,Math.abs(x[i]-y[i]));
  parity.push({time,maxFloatDiff,pixelDiff:diff(display(a),display(b)),wall:a.wall.count,workerWall:b.wall.count,companions:JSON.stringify(direct.spatialFrame)===JSON.stringify(worker.spatialFrame)&&JSON.stringify(direct.focalPoint)===JSON.stringify(worker.focalPoint)});if(!fixture)fixture=structuredClone(b);
 }
 const previews=document.querySelector('#previews');previews.replaceChildren();const families=[];
 function showFamily(label,frame){const stats=statsPixels(display(frame)),img=document.createElement('img');img.src=renderer.domElement.toDataURL();const figure=document.createElement('figure'),caption=document.createElement('figcaption');caption.textContent=label;figure.append(caption,img);previews.append(figure);return{label,carriers:frame.wall.count,instances:native.wall.mesh.geometry.instanceCount,...stats};}
 for(const[label,kind]of[['Membrane',0],['Caustics',1],['Cracks',3]]){const data=[];for(let i=0;i<fixture.wall.count;i++)if(fixture.wall.data[i*16+15]===kind)data.push(...fixture.wall.data.slice(i*16,(i+1)*16));families.push(showFamily(label,{...empty,wall:{count:data.length/16,data:new Float32Array(data)}}));}
 worker.setPresentation({wall:{material:'mosaic'}});await sample(2.05);const mosaic=structuredClone(worker.frame);families.push(showFamily('Mosaic',{...empty,wall:mosaic.wall}));const mosaicHasNoCaustics=Array.from({length:mosaic.wall.count},(_,i)=>mosaic.wall.data[i*16+15]).every(k=>k!==1);
 worker.setPresentation({wall:{material:'membrane',fringe:0}});await sample(2.05);const noFringe=display({...empty,wall:worker.frame.wall}),fringe=display({...empty,wall:fixture.wall}),fringeDiff=diff(noFringe,fringe);
 worker.setPresentation({wall:{mode:'off'}});await sample(2.05);const offClears=worker.frame.wall.count===0;display(worker.frame);const offGpuCalls=renderer.info.render.calls;
 worker.setPresentation({wall:{mode:'on',material:'membrane',fringe:.5}});
 const samples=[],stats=values=>{const v=[...values].sort((a,b)=>a-b);return{p50:v[Math.floor(v.length*.5)],p95:v[Math.floor(v.length*.95)],max:v.at(-1)};};
 for(let i=0;i<40;i++){await sample(2+i*.05);const start=performance.now();native.setFrame(worker.frame);const uploadMs=performance.now()-start;renderer.render(scene,camera);if(i>=8)samples.push({producerMs:worker.lastRenderMs,mainCallMs,transferMs:worker.lastTransferMs,roundtripMs:worker.frameLatencyMs,uploadMs});await new Promise(r=>requestAnimationFrame(r));}
 const profile=Object.fromEntries(['producerMs','mainCallMs','transferMs','roundtripMs','uploadMs'].map(k=>[k,stats(samples.map(s=>s[k]))]));
 const full=statsPixels(display(fixture)),gpu={calls:renderer.info.render.calls,triangles:renderer.info.render.triangles,textures:renderer.info.memory.textures,wallInstances:native.wall.mesh.geometry.instanceCount};native.setQualityBudget(360);display(fixture);const lowInstances=native.wall.mesh.geometry.instanceCount;native.setQualityBudget(1440);camera.rotation.y=.3;const oblique=statsPixels(display(fixture));camera.rotation.y=0;display(fixture);
 const report={pass:parity.every(p=>p.maxFloatDiff===0&&p.pixelDiff.pixels===0&&p.wall===p.workerWall&&p.companions)&&near>.5&&near>far*1.5&&nearCulled&&priority.every(p=>p.pass)&&families.every(f=>f.lit>10)&&mosaicHasNoCaustics&&fringeDiff.pixels>10&&offClears&&offGpuCalls===3&&gpu.calls===4&&gpu.textures===0&&lowInstances<gpu.wallInstances&&oblique.lit>10&&JSON.stringify(analysis)===before,
  parity,stereo:{near,far},nearCulled,priority,families,mosaicHasNoCaustics,fringeDiff,offClears,offGpuCalls,gpu,quality:{lowInstances,fullInstances:gpu.wallInstances},full,oblique,profile,profileSamples:samples,execution:worker.executionLabel,analysisUnchanged:JSON.stringify(analysis)===before,
  limits:['Desktop evidence, no physical Quest/GPU execution or comfort claim.','Original light paths represented as spatial strokes, not a solid opaque membrane.','Chromatic fringe is edge light; lens/background refraction/deep-field imaging remain T06f.','Preview/history cadence unchanged; no exact replay or speedup claim.']};output.textContent=JSON.stringify(report,null,2);
}catch(error){output.textContent=JSON.stringify({pass:false,error:error.stack},null,2);}finally{button.disabled=false;}};
</script></html>
