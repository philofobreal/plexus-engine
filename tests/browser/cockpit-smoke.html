<!doctype html><html lang="en"><meta charset="utf-8"><title>T07 cockpit GPU / marquee smoke</title>
<style>body{margin:24px;background:#080e1a;color:#d9f6ff;font:15px system-ui}button{padding:12px}#gallery{display:flex;flex-wrap:wrap;gap:12px}figure{margin:0}img{width:480px;max-width:100%}pre{white-space:pre-wrap}</style>
<h1>T07 cockpit / fixed-width filename GPU smoke</h1><button id="run" disabled>Run actual Three.js cockpit and caption checks</button><p id="status">Ready</p><div id="gallery"></div><pre id="result"></pre>
<script type="module">
import * as THREE from 'three';
import{XrCockpit}from'../../src/xr/scene/XrCockpit.ts';
import{XrTrackMarquee}from'../../src/xr/scene/XrTrackMarquee.ts';
import{resolvePlayProfile}from'../../src/xr/XrPlayProfile.ts';
const result=document.querySelector('#result'),gallery=document.querySelector('#gallery');
function require(v,label){if(!v)throw Error(label);}
function diff(a,b){let n=0;for(let i=0;i<a.length;i+=4)if(Math.abs(a[i]-b[i])+Math.abs(a[i+1]-b[i+1])+Math.abs(a[i+2]-b[i+2])>6)n++;return n;}
function bbox(a,w){let n=0,min=w,max=-1;for(let i=0;i<a.length;i+=4)if(a[i]+a[i+1]+a[i+2]>120){n++;min=Math.min(min,(i/4)%w);max=Math.max(max,(i/4)%w);}return{n,min,max};}
function show(renderer,label){const figure=document.createElement('figure'),caption=document.createElement('figcaption'),img=document.createElement('img');caption.textContent=label;img.src=renderer.domElement.toDataURL('image/png');figure.append(caption,img);gallery.append(figure);}
document.querySelector('#run').disabled=false;document.querySelector('#status').textContent='Modules ready';
document.querySelector('#run').onclick=()=>{try{
 const renderer=new THREE.WebGLRenderer({antialias:false,preserveDrawingBuffer:true});renderer.setSize(640,360);renderer.setPixelRatio(1);
 const scene=new THREE.Scene();scene.background=new THREE.Color(0x060c16);const c=new XrCockpit(),p=resolvePlayProfile({},'tall');c.fit(p.config,p.stage,1.65);c.setTitle('Plexus — árvíztűrő panoráma futószöveg / a long filename sample.wav');scene.add(c.root);c.setViewOrigin(2.6);
 const camera=new THREE.PerspectiveCamera(70,640/360,.05,1000);camera.position.set(0,1.65,2.6);camera.updateMatrixWorld();c.update(3);renderer.render(scene,camera);
 const production={calls:renderer.info.render.calls,triangles:renderer.info.render.triangles,textures:renderer.info.memory.textures,atlasBytes:c.title.atlasBytes};require(production.calls===3&&production.triangles<1600&&production.textures===1,'bounded production GPU budget');show(renderer,'Desktop stage: Full cockpit and filename');
 const profile=mode=>{c.setSettings(mode,'scroll');const samples=[];for(let i=0;i<40;i++){const start=performance.now();c.update(i/60);renderer.render(scene,camera);if(i>=8)samples.push(performance.now()-start);}samples.sort((a,b)=>a-b);return{samples:32,warmup:8,p50:samples[15],p95:samples[30],max:samples[31]};};
 const mainSubmission={off:profile('off'),full:profile('full'),scope:'Desktop CPU update/render submission only, not GPU execution or physical Quest timing'};c.update(3);
 const target=new THREE.WebGLRenderTarget(640,360);const capture=(s,cam)=>{renderer.setRenderTarget(target);renderer.render(s,cam);const out=new Uint8Array(640*360*4);renderer.readRenderTargetPixels(target,0,0,640,360,out);renderer.setRenderTarget(null);return out;};
 c.setSettings('off','scroll');const off=capture(scene,camera),offCalls=renderer.info.render.calls;require(offCalls===0,'Off has no draws');c.setSettings('full','scroll');c.update(3);const full=capture(scene,camera);require(diff(full,off)>10000,'visible structure');c.setSettings('reduced','scroll');capture(scene,camera);const reduced={calls:renderer.info.render.calls,triangles:renderer.info.render.triangles};require(reduced.triangles<production.triangles,'Reduced lowers triangles');c.setSettings('full','scroll');
 c.setViewOrigin(0);const views=[];for(const[x,y,z,yaw]of[[0,1.65,0,0],[-.25,1.65,0,.28],[.25,1.65,0,-.28],[0,1.95,0,0]]){camera.position.set(x,y,z);camera.rotation.set(0,yaw,0);camera.updateMatrixWorld();const a=capture(scene,camera);c.setSettings('off','scroll');const baseline=capture(scene,camera);c.setSettings('full','scroll');const changed=diff(a,baseline);require(changed>100,'off-axis cockpit remains visible');views.push({x,y,z,yaw,changed});renderer.render(scene,camera);show(renderer,'Logical headset view '+[x,y,z,yaw].join(', '));}
 const title=new XrTrackMarquee(),titleScene=new THREE.Scene();titleScene.background=new THREE.Color(0);titleScene.add(title.mesh);const titleCamera=new THREE.OrthographicCamera(-1.2,1.2,.2,-.2,.01,10);titleCamera.position.z=2;titleCamera.updateMatrixWorld();
 title.setTitle('ABCDEFGHIJKLMNOPQRSTUVWXYZ — árvíztűrő tükörfúrógép — '.repeat(7)+'.flac');title.update(0);const first=capture(titleScene,titleCamera),uploads=title.uploadCount,version=title.mesh.material.uniforms.uAtlas.value.version;const firstBox=bbox(first,640);require(firstBox.n>100&&firstBox.min>=52&&firstBox.max<=588,'clipped fixed-width caption');
 title.update(3);const moved=capture(titleScene,titleCamera);const changed=diff(first,moved);require(changed>100,'caption scrolls');title.update(3);require(diff(moved,capture(titleScene,titleCamera))===0,'paused repeat');title.update(0);require(diff(first,capture(titleScene,titleCamera))===0,'seek replay');title.update(64);const seam=bbox(capture(titleScene,titleCamera),640);require(seam.n>100&&seam.min>=52&&seam.max<=588,'atlas-row seam');require(title.uploadCount===uploads&&title.mesh.material.uniforms.uAtlas.value.version===version,'no canvas upload per frame');title.setMode('static');title.update(4);require(title.mesh.material.uniforms.uOffset.value===0,'Static offset');renderer.render(titleScene,titleCamera);show(renderer,'Clipped title atlas / Static option');
 title.setMode('off');capture(titleScene,titleCamera);require(renderer.info.render.calls===0,'Title Off bypass');title.setMode('scroll');
 let maxTextures=0;for(let i=0;i<16;i++){title.setTitle('Replacement filename '+i+'.wav');renderer.setRenderTarget(target);renderer.render(titleScene,titleCamera);maxTextures=Math.max(maxTextures,renderer.info.memory.textures);}renderer.setRenderTarget(null);require(maxTextures<=3,'replacement atlas does not leak');
 const output={pass:true,production,mainSubmission,reduced,offCalls,views,caption:{firstBox,changedPixels:changed,seam,uploadsUnchanged:true,pauseIdentical:true,seekIdentical:true,fixedWidth:title.mesh.geometry.parameters.width,maxAtlasBytes:2048*512*4,replacementMaxTextures:maxTextures},physicalQuest:'unmeasured',gpuExecutionTime:'unmeasured'};
 title.dispose();c.dispose();target.dispose();renderer.dispose();result.textContent=JSON.stringify(output,null,2);document.querySelector('#status').textContent='PASS';
}catch(error){result.textContent=JSON.stringify({pass:false,error:String(error),stack:error.stack},null,2);document.querySelector('#status').textContent='FAIL';console.error(error);}};
</script>
