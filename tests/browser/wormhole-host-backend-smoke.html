    for(let round=0;round<2;round++)for(const index of round?[5,4,3,2,1,0]:[0,1,2,3,4,5]){
     profileClockStart=performance.now(); const [mode,reduced]=variants[index];Object.assign(hostQuality,{wormholeRenderer:mode,compactMaterialPreview:reduced,maxBackingLongEdge:reduced?1280:1920});hostP.windowResized();
     for(let i=0;i<8;i++){await new Promise(requestAnimationFrame);await hostP.redraw();}
     for(let wait=0;mode==='offscreen'&&hostP.canvas.dataset.wormholeRaster==='offscreen-pending'&&wait<120;wait++){await new Promise(requestAnimationFrame);await hostP.redraw();}
     const receivedBefore=profileSource?.framesReceived??0;
     const sampleStarted=performance.now();for(let i=0;i<20||performance.now()-sampleStarted<1400;i++){await new Promise(requestAnimationFrame);const start=performance.now();await hostP.redraw();buckets[index].push(performance.now()-start);}
     observed[index]={raster:hostP.canvas.dataset.wormholeRaster,backing:[hostP.canvas.width,hostP.canvas.height]};if(mode==='offscreen'){Object.assign(observed[index],{workerFrames:profileSource.framesReceived-receivedBefore,lastWorkerRenderMs:profileSource.lastRenderMs});if(observed[index].workerFrames<1)throw Error('Worker did not progress: '+JSON.stringify(observed[index]));}
     if(mode==='offscreen'?!observed[index].raster.startsWith('offscreen-'):observed[index].raster!==mode)throw Error('Requested raster not active: '+mode);
     output.textContent='Measuring '+(material?'material':'primitives')+' / '+mode+' / '+(reduced?'Reduced':'Auto')+'…';
    }
    for(let i=0;i<variants.length;i++){const a=buckets[i].sort((a,b)=>a-b),[mode,reduced]=variants[i];measurements.push({material,mode,quality:reduced?'reduced':'auto',...observed[i],samples:a.length,p50ms:a[Math.floor(a.length*.5)],p95ms:a[Math.floor(a.length*.95)]});}
   }
   State.isPlaying=false;profileClockStart=null;let identityDraws=0,posts=0;
   const identity=registry.get('cosmic-wormhole'),draw=identity.draw,post=PostFxPipeline.prototype.render;
   identity.draw=function(...args){identityDraws++;return draw.apply(this,args);};PostFxPipeline.prototype.render=function(...args){posts++;return post.apply(this,args);};
   try{let previous=performance.now();const until=previous+1400;
    while(performance.now()<until){await new Promise(requestAnimationFrame);const now=performance.now();hostP.deltaTime=now-previous;previous=now;await hostP.redraw();}
    identityDraws=0;posts=0;for(let i=0;i<20;i++)await hostP.redraw();}
   finally{identity.draw=draw;PostFxPipeline.prototype.render=post;}
   output.textContent=JSON.stringify({scope:'Desktop real PlexusRenderer CPU draw + submission wall time; includes final p5 copy. Not GPU completion, frame rate or Quest.',logicalSize:hostSize,rounds:'forward then reverse, 8 warmup, at least 20 samples and 1.4 seconds per variant per round',measurements,settledPaused:{samples:20,identityDraws,posts},activeRaster:hostP.canvas.dataset.wormholeRaster},null,2);
  }catch(error){output.textContent='FAIL: '+error.stack;console.error(error);}finally{State.isPlaying=false;button.disabled=false;}
 };
 publish();
}catch(error){result.textContent='FAIL: '+error.stack;console.error(error);}
// Matched old-worker/new-worker requests: same logical size, raster cap, resolved frame and history.
window.runWh04WorkerBenchmark=async()=>{
 const c=state({...raw,wormholeNebulaAmount:.65,wormholeNebulaDetail:.8,wormholeWall:0,wormholeOpticsEnabled:0});
 const {frames,events,trackAnalysis,sampleRate,hopSize,bpm,...values}=c.state;
 const analysis={frames,events,trackAnalysis,sampleRate,hopSize,bpm},workers=[new HostWorker(),new HostWorker()];
 const send=(worker,message)=>new Promise((resolve,reject)=>{
  const timer=setTimeout(()=>reject(Error('Worker measurement timed out')),15000);
  worker.onmessage=({data})=>{clearTimeout(timer);data.type==='failure'?reject(Error(data.message)):resolve(data);};
  worker.onerror=error=>{clearTimeout(timer);reject(error);};worker.postMessage(message);
 });
 const samples=[[],[]],reported=[[],[]];let comparison;
 try{
  await Promise.all(workers.map((w,i)=>send(w,{type:'prepare',generation:1,...(i?{contextId:'wh04-matched'}:{}),analysis})));
  for(let n=0;n<12;n++){
   const images=[];
   for(const i of n%2?[1,0]:[0,1]){
    const time=3+n/30,frame={...values,currentTime:time,width:1920,height:1080,density:.5,compact:false,depthCue:.6,
     transparent:false,skybox:false,reset:n===0,frameCount:n+1};
    const stamp={protocol:1,contextId:'wh04-matched',generation:1,requestSerial:n+1,presentationRevision:0,songTime:time,mode:'preview'};
    const start=performance.now(),m=await send(workers[i],{type:'render',generation:1,serial:n+1,...(i?{stamp}:{}),frame});
    const elapsed=performance.now()-start;
    if(n>=4){samples[i].push(elapsed);reported[i].push(m.renderMs);}
    if(i&&m.raster!=='gpu-material')throw Error('GPU path unavailable in matched benchmark');
    if(n===11){const canvas=new OffscreenCanvas(960,540),ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.drawImage(m.bitmap,0,0);images[i]=new Uint8Array(ctx.getImageData(0,0,960,540).data.buffer);}
    m.bitmap.close();
   }
   if(n===11)comparison=compareRgba(images[0],images[1],960,540);
  }
  const summary=a=>{const b=[...a].sort((a,b)=>a-b);return {samples:a,p50:b[Math.floor(b.length*.5)],p95:b[Math.floor(b.length*.95)]};};
  return {scope:'Matched worker request-to-bitmap-ack latency, same 1920x1080 logical / 960x540 raster; four warmups, eight measured AB/BA pairs.',
   legacy:summary(samples[0]),gpu:summary(samples[1]),reportedRender:[summary(reported[0]),summary(reported[1])],comparison};
 }finally{workers.forEach(w=>w.terminate());c.dispose();}
};
