[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plexus-analyzer-lab"
version = "0.1.0"
description = "Isolated MIR measurement and evidence pipeline for Plexus"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.2.6", "scipy==1.15.3", "soundfile==0.13.1",
  "librosa==0.11.0", "mir_eval==0.8.2", "jsonschema==4.25.1"
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
plexus-analyzer-lab = "plexus_analyzer_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# Editable checkout is intentional: schemas, bridge and production source remain
# repository-owned resources rather than copied into a distributable wheel.
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: exercises Node and the real production analyzer"]
